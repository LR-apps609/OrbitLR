name: OrbitLR
options:
  bundleIdPrefix: it.ledion
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: it

targets:
  OrbitLR:
    type: application
    platform: macOS
    scheme: {}
    dependencies:
      - target: OrbitLRShare        # estensione «Condividi», inclusa nell'app
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/LRConverter.zsh
        buildPhase: resources
      - path: Resources/Sounds
        buildPhase: resources
      - path: NOVITA.txt              # «Cosa c'è di nuovo» dopo un aggiornamento
        buildPhase: resources
      # 4.2 · I testi in inglese (lingua di partenza: italiano)
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/InfoPlist.xcstrings
        buildPhase: resources
      - path: NEWS.txt                # «What's new» in inglese
        buildPhase: resources
      # 3.8 · Motori dentro l'app (ffmpeg LGPL, Apple Silicon e Intel): li prepara la compilazione su GitHub
      - path: Resources/Motori
        type: folder
        buildPhase: resources
        optional: true
      # Modelli di IA (Real-ESRGAN, BSD-3): copiati così come sono, l'app li compila al primo uso
      - path: Resources/Models
        type: folder
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: OrbitLR
        CFBundleName: OrbitLR
        CFBundleDevelopmentRegion: it
        CFBundleShortVersionString: "5.1"
        CFBundleVersion: "79"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Uso personale di Ledion"
        NSAppleEventsUsageDescription: "OrbitLR legge i file selezionati nel Finder quando usi la scorciatoia da tastiera."
        NSDesktopFolderUsageDescription: "OrbitLR converte e salva i file che tieni sulla Scrivania."
        NSDocumentsFolderUsageDescription: "OrbitLR apre e salva i tuoi file e progetti in Documenti."
        NSDownloadsFolderUsageDescription: "OrbitLR converte i file scaricati e salva lì i risultati."
        NSSpeechRecognitionUsageDescription: "OrbitLR ascolta le clip del montaggio per scrivere i sottotitoli automatici, sul tuo Mac."
        # «Apri con → OrbitLR» per qualsiasi file
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Aggiornamento di OrbitLR"
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [it.ledion.orbitlr.update]
          - CFBundleTypeName: "Tutti i file"
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.item]
        # orbitlr://open?f=… — usato dall'estensione «Condividi» per passare i file all'app
        CFBundleURLTypes:
          - CFBundleURLName: it.ledion.OrbitLR
            CFBundleURLSchemes: [orbitlr]
        # I file .orbitlr sono gli aggiornamenti: doppio clic → si installano da soli
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: it.ledion.orbitlr.update
            UTTypeDescription: "Aggiornamento di OrbitLR"
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [orbitlr]
        # Voce «OrbitLR» nel tasto destro del Finder (Servizi / Azioni rapide)
        NSServices:
          - NSMenuItem:
              default: OrbitLR
            NSMessage: convertFiles
            NSPortName: OrbitLR
            NSRequiredContext: {}
            NSSendFileTypes: [public.item]
    # 3.5.2 · Con il «runtime rinforzato» nessun altro programma può infilare codice dentro OrbitLR
    # e usare i permessi che le hai dato. L'unica eccezione dichiarata: comandare il Finder (selezione per ⌥⌘C).
    entitlements:
      path: Sources/OrbitLR.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.ledion.OrbitLR
        PRODUCT_NAME: OrbitLR
        MARKETING_VERSION: "5.1"
        CURRENT_PROJECT_VERSION: "79"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Colore dei controlli di sistema (selezione nella barra laterale, interruttori…): salvia, non il blu di macOS
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        COMBINE_HIDPI_IMAGES: YES

  # Estensione «Condividi» (punto 13): Condividi → OrbitLR da Foto, Mail, Safari, Anteprima, Finder
  OrbitLRShare:
    type: app-extension
    platform: macOS
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: OrbitLR
        CFBundleShortVersionString: "5.1"
        CFBundleVersion: "79"
        LSMinimumSystemVersion: "14.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: 'SUBQUERY (extensionItems, $extensionItem, SUBQUERY ($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.file-url" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.movie" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.audio" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf").@count >= 1).@count >= 1'
    entitlements:
      path: ShareExtension/OrbitLRShare.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.downloads.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.ledion.OrbitLR.Share
        PRODUCT_NAME: OrbitLRShare
        MARKETING_VERSION: "5.1"
        CURRENT_PROJECT_VERSION: "79"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SKIP_INSTALL: YES

  # Test automatici: creano video e audio di prova e controllano montaggio, musica, voci, esportazione e strumenti audio.
  # Girano sul Mac di GitHub a ogni modifica; se uno fallisce, la versione non viene pubblicata.
  OrbitLRTests:
    type: bundle.unit-test
    platform: macOS
    # Il codice dell'app compilato direttamente nei test (tranne il punto d'ingresso):
    # l'app non si apre, quindi niente finestre né grafica sul Mac di GitHub
    sources:
      - path: Tests
      - path: Sources
        excludes:
          - "Main.swift"
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.ledion.OrbitLRTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_IDENTITY: "-"

schemes:
  OrbitLRTests:
    build:
      targets:
        OrbitLRTests: [test]
    test:
      config: Debug
      targets:
        - OrbitLRTests

