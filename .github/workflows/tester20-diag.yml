# Diagnosi mirata (coordinatore): 300 HEIC aperte insieme, campione del thread principale stampato nel registro.
name: tester20-diag
on:
  push:
    branches: ['tester20-diag']
permissions:
  contents: read
  actions: read
jobs:
  heic:
    strategy:
      fail-fast: false
      matrix:
        run_id: ['43474125874']
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v5
        if: matrix.run_id != ''
        continue-on-error: true
        with:
          name: pacchetto
          run-id: ${{ matrix.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/p
      - name: Installo
        run: |
          mkdir -p "$RUNNER_TEMP/x"
          if [ -f "$RUNNER_TEMP/p/pacchetto.tar" ]; then tar -C "$RUNNER_TEMP/x" -xf "$RUNNER_TEMP/p/pacchetto.tar"
          else curl -fsSL -o o.orbitlr https://github.com/LR-apps609/OrbitLR/releases/download/v6.0.3/OrbitLR.6.0.3.orbitlr && ditto -x -k o.orbitlr "$RUNNER_TEMP/x"; fi
          A=$(find "$RUNNER_TEMP/x" -maxdepth 4 -type d -name OrbitLR.app -path '*Prebuilt*' | head -n1)
          ditto "$A" /Applications/OrbitLR.app; xattr -dr com.apple.quarantine /Applications/OrbitLR.app || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /Applications/OrbitLR.app/Contents/Info.plist
          D=it.ledion.OrbitLR; V=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /Applications/OrbitLR.app/Contents/Info.plist)
          defaults write $D welcomeDone -bool true; defaults write $D launchScreen -bool false; defaults write $D tips -bool false; defaults write $D lastLaunchVersion -string "$V"
      - name: 300 HEIC
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/h"; cd "$RUNNER_TEMP/h"
          sips -s format heic /System/Library/Desktop\ Pictures/*.heic -o base.heic >/dev/null 2>&1 || true
          [ -s base.heic ] || { sips -z 1200 1600 -s format heic "$(ls /System/Library/Desktop\ Pictures/*.{jpg,png,heic} 2>/dev/null | head -1)" --out base.heic >/dev/null; }
          ls -la base.heic
          for n in 10 100 300; do
            rm -rf set$n; mkdir set$n; for i in $(seq 1 $n); do cp base.heic "set$n/foto $i.heic"; done
          done
          for n in 100; do
            echo "======== $n file"
            pkill -9 -x OrbitLR; sleep 2
            open /Applications/OrbitLR.app; sleep 20
            P=$(pgrep -x OrbitLR); echo "pid $P"
            open -a /Applications/OrbitLR.app set$n/*.heic
            for at in 3 10; do
              sleep 4
              sample $P 3 -mayDie -file s$at.txt >/dev/null 2>&1
              echo "--- campione a circa +$at s: thread principale (prime 140 righe dell'albero)"
              awk '/Call graph:/{c=1} c&&/Thread_/{if(m)exit; if(/main-thread/)m=1} m' s$at.txt | sed -E 's/ +\[0x[0-9a-f,]+\]//; s/\(in ([^)]*)\)/[\1]/' | cut -c1-200 | head -140
            done
            tail -n 8 ~/Library/Logs/LRConverter.log
            osascript -e 'with timeout of 10 seconds' -e 'tell application id "it.ledion.OrbitLR" to quit' -e 'end timeout' >/dev/null 2>&1 &
            sleep 12; pgrep -x OrbitLR && { echo "NON SI CHIUDE con quit dopo 12 s"; sample $P 2 -mayDie -file sq.txt >/dev/null 2>&1; echo "--- campione dopo quit"; awk '/Call graph:/{c=1} c&&/Thread_/{if(m)exit; if(/main-thread/)m=1} m' sq.txt | sed -E 's/ +\[0x[0-9a-f,]+\]//' | cut -c1-200 | head -80; } || echo "chiusa con quit"
          done
