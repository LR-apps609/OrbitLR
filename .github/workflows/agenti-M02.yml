# Agente M02 · PDF e documenti sul motore LRConverter.zsh (solo prove, nessuna pubblicazione)
name: agenti M02 PDF e documenti
on:
  push:
    branches: ['agenti/M02']
  workflow_dispatch:
    inputs:
      build:
        description: '602 (pubblicata) oppure 603 (candidata, run 42406653535)'
        default: '602'
permissions:
  contents: read
  actions: read
concurrency:
  group: agenti-M02-${{ github.ref }}-${{ inputs.build || '602' }}
  cancel-in-progress: false
jobs:
  prove:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: [pdf, doc]
    runs-on: macos-26
    timeout-minutes: 45
    env:
      BUILD: ${{ inputs.build || '602' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: echo "W=$RUNNER_TEMP/m02" >> $GITHUB_ENV
      - name: Scarico la 6.0.3 (pacchetto della run 42406653535)
        if: env.BUILD == '603'
        uses: actions/download-artifact@v5
        with:
          name: pacchetto
          run-id: 42406653535
          github-token: ${{ github.token }}
          path: pk
      - name: Installo OrbitLR
        run: |
          set -x
          sw_vers; uname -m
          mkdir -p x
          if [ "$BUILD" = "603" ]; then
            tar -C x -xf pk/pacchetto.tar; APPSRC=x/OrbitLR/Prebuilt/OrbitLR.app
          else
            curl -fsSL --retry 3 -o o.orbitlr https://github.com/LR-apps609/OrbitLR/releases/download/v6.0.2/OrbitLR.6.0.2.orbitlr
            ditto -x -k o.orbitlr x; APPSRC=x/Prebuilt/OrbitLR.app
          fi
          ditto "$APPSRC" /Applications/OrbitLR.app
          xattr -dr com.apple.quarantine /Applications/OrbitLR.app || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" /Applications/OrbitLR.app/Contents/Info.plist
          E=$(find /Applications/OrbitLR.app -name LRConverter.zsh | head -n 1); echo "ENGINE=$E" >> $GITHUB_ENV
          shasum -a 256 "$E"; ls /Applications/OrbitLR.app/Contents/Resources/Motori || true
          which gs soffice pandoc qpdf || true
      - name: Python per i file di prova
        run: |
          python3 -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" -q install pypdf cryptography reportlab pillow python-docx openpyxl python-pptx
      - name: Comprimi senza Ghostscript (e compila lrhelper)
        if: matrix.mode == 'pdf'
        run: |
          mkdir -p "$W/senza-gs"; cd "$W/senza-gs"
          "$RUNNER_TEMP/v/bin/python" -c "from reportlab.pdfgen import canvas; c=canvas.Canvas('a.pdf'); c.drawString(72,720,'ciao'); c.showPage(); c.save()"
          if ! command -v gs; then
            S=$SECONDS; LR_DESTPATH="$W/senza-gs/out" /bin/zsh "$ENGINE" --run pdfcompress medium "$W/senza-gs/a.pdf" | tee senza-gs.txt; echo "rc=$? secondi=$((SECONDS-S))" | tee -a senza-gs.txt
          fi
      - name: Motori (Ghostscript; LibreOffice e pandoc per i documenti)
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          if [ "${{ matrix.mode }}" = pdf ]; then brew install ghostscript; else brew install pandoc ghostscript; brew install --cask libreoffice; fi
          gs --version || true; pandoc --version | head -n 1 || true
      - name: Sequenza ${{ matrix.mode }}
        run: |
          mkdir -p "$W"
          M02_GS=1 M02_BUDGET=1800 "$RUNNER_TEMP/v/bin/python" -u Tests/Agenti/M02/suite.py "$ENGINE" "$W" ${{ matrix.mode }} "$BUILD" 2>&1 | tee "$W/sequenza-${{ matrix.mode }}.txt"
      - name: Controllo automatico del motore (--test)
        if: always() && matrix.mode == 'doc'
        run: |
          S=$SECONDS
          ( /bin/zsh "$ENGINE" --test > "$W/selftest.txt" 2>&1 & P=$!; ( sleep 600; kill -9 $P 2>/dev/null ) & wait $P ) || true
          echo "secondi=$((SECONDS-S))" >> "$W/selftest.txt"; cat "$W/selftest.txt"
      - name: Raccolgo log e rapporti
        if: always()
        run: |
          mkdir -p "$W/log"
          cp ~/Library/Logs/LRConverter.log "$W/log/" 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/* "$W/log/" 2>/dev/null || true
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null || true
          ls -la ~/Desktop 2>/dev/null || true
          du -sh "$W" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m02-${{ matrix.mode }}-${{ env.BUILD }}
          retention-days: 7
          path: |
            ${{ env.W }}
            !${{ env.W }}/fixtures
            !${{ env.W }}/**/*.png
            !${{ env.W }}/**/*.jpg
            !${{ env.W }}/out/*trecento*
