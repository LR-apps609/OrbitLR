name: agenti-M05
on:
  push:
    branches: ['agenti/M05']
  workflow_dispatch:
    inputs:
      sequenze:
        description: 'Sequenze (vuoto = tutte)'
        required: false
permissions:
  contents: read
  actions: read
jobs:
  aggiornamenti:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mac: [xcode-27, macos-26]
    runs-on: ${{ matrix.mac }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Scarico le versioni pubblicate
        run: |
          mkdir -p "$RUNNER_TEMP/rel"
          for v in 5.0 5.1.1 6.0.2; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/rel/OrbitLR.$v.orbitlr" "https://github.com/LR-apps609/OrbitLR/releases/download/v$v/OrbitLR.$v.orbitlr" &
          done
          wait; ls -la "$RUNNER_TEMP/rel"
      - name: Pacchetto 6.0.3 (se pronto)
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: pacchetto
          run-id: 42407890132
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/p603
      - name: Estraggo 6.0.3
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/rel/603" && tar -C "$RUNNER_TEMP/rel/603" -xf "$RUNNER_TEMP/p603/pacchetto.tar" && find "$RUNNER_TEMP/rel/603" -maxdepth 3 | head
      - name: Sequenze
        shell: zsh {0}
        timeout-minutes: 38
        env:
          SEQ: ${{ github.event.inputs.sequenze }}
        run: |
          S=${SEQ:-"arch:6.0.3 file:5.1.1:6.0.2:aperta nostrumenti:5.1.1:6.0.2 nostrumenti:5.0:6.0.2 licenza:5.1.1:6.0.2 file:5.0:6.0.2:chiusa"}
          zsh Tests/Agenti/M05/prova.sh "$RUNNER_TEMP/rel" "$RUNNER_TEMP/out/${{ matrix.mac }}" ${=S} || true
          echo "======== RISULTATI"; cat "$RUNNER_TEMP/out/${{ matrix.mac }}/risultati.txt"
      - name: Carico registri e foto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M05-${{ matrix.mac }}
          path: ${{ runner.temp }}/out
          retention-days: 7
