# W05 · motore Windows (video e audio) con percorsi difficili. Solo prove: niente rilasci, niente segreti.
name: agenti W05

on:
  push:
    branches: ['agenti/W05']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: agenti-W05
  cancel-in-progress: false

jobs:
  percorsi:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - gruppo: C
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Motori (ffmpeg LGPL e whisper.cpp) con impronta controllata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download motori-win-1 -p motori-win-1.zip -R "$GITHUB_REPOSITORY"
          echo "$(cut -d' ' -f1 Windows/motori.sha256)  motori-win-1.zip" | sha256sum -c -
          unzip -q motori-win-1.zip -d motori-tmp
          mkdir -p motori/voce
          cp motori-tmp/Motori/ffmpeg.exe motori-tmp/Motori/ffprobe.exe motori/
          gh release download motori-win-voce-1 -p motori-win-voce-1.zip -R "$GITHUB_REPOSITORY"
          echo "$(cut -d' ' -f1 Windows/motori-voce.sha256)  motori-win-voce-1.zip" | sha256sum -c -
          unzip -q motori-win-voce-1.zip -d voce-tmp
          cp voce-tmp/Voce/* motori/voce/
          ls -la motori motori/voce
          sha256sum motori/*.exe motori/voce/* > motori-impronte.txt
          ./motori/ffmpeg.exe -hide_banner -version | head -n 1

      - name: Modello della voce
        shell: bash
        run: |
          mkdir -p modello-voce
          curl -fL --retry 3 -o modello-voce/ggml-small-q5_1.bin "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin"
          echo "ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  modello-voce/ggml-small-q5_1.bin" | sha256sum -c -

      - name: Gruppo C · OrbitLR 2.0 pubblicata, il suo whisper-cli con un nome utente accentato
        timeout-minutes: 20
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $r = "$env:RUNNER_TEMP\w05\report"; New-Item -ItemType Directory -Force $r | Out-Null
          $log = "$r\versione-2.0.txt"
          gh release download windows-anteprima -p "OrbitLR-Windows-2.0.0-Setup.exe" -R "$env:GITHUB_REPOSITORY"
          $inst = Start-Process .\OrbitLR-Windows-2.0.0-Setup.exe -ArgumentList "/S" -PassThru
          $inst.WaitForExit(240000) | Out-Null
          Start-Sleep 5
          $voce = Get-ChildItem "$env:LOCALAPPDATA\OrbitLR" -Recurse -Filter whisper-cli.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          "installato: $([bool]$voce) $($voce.FullName -replace [regex]::Escape($env:USERPROFILE),'%USERPROFILE%')" | Tee-Object -Append $log
          if (-not $voce) { Get-ChildItem "$env:LOCALAPPDATA\OrbitLR" -Recurse -Depth 3 | Select-Object -First 40 FullName | Out-String | Tee-Object -Append $log; exit 0 }
          $h1 = (Get-FileHash $voce.FullName).Hash; $h2 = (Get-FileHash .\motori\voce\whisper-cli.exe).Hash
          "whisper-cli 2.0 = $h1 · motori-win-voce-1 = $h2 · uguali: $($h1 -eq $h2)" | Tee-Object -Append $log
          $ff = Get-ChildItem "$env:LOCALAPPDATA\OrbitLR" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          "ffmpeg 2.0 uguale a motori-win-1: $((Get-FileHash $ff.FullName).Hash -eq (Get-FileHash .\motori\ffmpeg.exe).Hash)" | Tee-Object -Append $log
          $w = "$env:RUNNER_TEMP\w05"; New-Item -ItemType Directory -Force $w | Out-Null
          & .\motori\ffmpeg.exe -hide_banner -loglevel error -y -f lavfi -i "sine=f=440:d=3" -ac 1 -ar 16000 -c:a pcm_s16le "$w\a16.wav"
          $m = "$pwd\modello-voce\ggml-small-q5_1.bin"
          foreach ($nome in @("Mario Rossi", "Niccolò", "Łukasz")) {
            $d = "$w\Users\$nome\AppData\Local\it.ledion.orbitlr\modelli"; New-Item -ItemType Directory -Force $d | Out-Null
            Copy-Item $m "$d\ggml-small-q5_1.bin"
            $out = & $voce.FullName -m "$d\ggml-small-q5_1.bin" -f "$w\a16.wav" -l en -t 2 -oj -of "$w\r" 2>&1 | Out-String; $code = $LASTEXITCODE
            $tail = ($out -split "`n" | Where-Object { $_ -match 'failed|error' } | Select-Object -Last 2) -join ' / '
            "2.0 · modello in C:\Users\$nome\AppData\Local\it.ledion.orbitlr: uscita=$code · $tail" | Tee-Object -Append $log
            Remove-Item "$d\ggml-small-q5_1.bin"
          }

      - name: Copia gli avanzi e i risultati
        if: always()
        shell: pwsh
        run: |
          $r = "$env:RUNNER_TEMP\w05\report"; New-Item -ItemType Directory -Force $r | Out-Null
          Get-ChildItem "$r" | Format-Table Name, Length | Out-String | Write-Output
          Get-ChildItem "$r\riassunto-*.md" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_ | Select-Object -First 8 | ForEach-Object { Write-Output "::notice::$_" } }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w05-rapporto-${{ matrix.gruppo }}
          path: ${{ runner.temp }}\w05\report
          retention-days: 7
