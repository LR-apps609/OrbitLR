# Compila OrbitLR su un Mac di GitHub a ogni modifica.
# Se la compilazione fallisce, gli errori sono nel registro dell'«azione» e nessuna versione viene distribuita.
# Se riesce, scarichi dagli «Artifacts» il file .orbitlr pronto per il doppio clic.
name: Compila OrbitLR

on:
  push:
    branches-ignore: [foto, foto-richiesta, foto-dispositivi, motori, modello-lama]
    # Il sito (web/) si pubblica da solo con «sito.yml»: non serve ricompilare l'app
    paths-ignore: ['web/**', '.github/workflows/sito.yml']
  pull_request:
  workflow_dispatch:

# 3.5.2 · Compilazione e test non possono pubblicare niente: solo il lavoro «release» (alla fine) ha il permesso
permissions:
  contents: read

jobs:
  build:
    # I Mac Apple Silicon di GitHub sono spesso esauriti: si usa il Mac Intel, che compila lo stesso per entrambi
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Xcode più recente disponibile
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Motori dentro l'app (ffmpeg LGPL)
        run: |
          # Sempre lo stesso file, controllato con l'impronta scritta nel progetto: se cambia, ci si ferma
          curl -fL --retry 3 -o motori-2.zip https://github.com/LR-apps609/OrbitLR/releases/download/motori-2/motori-2.zip
          shasum -a 256 -c Tools/motori.sha256
          rm -rf Resources/Motori && ditto -x -k motori-2.zip Resources
          for b in Resources/Motori/ffmpeg Resources/Motori/ffprobe; do codesign -f -s - --options runtime "$b"; done
          ./Resources/Motori/ffmpeg -hide_banner -version | head -n 1
          rm -f motori-2.zip

      - name: Motore del vettoriale (orbit-vector, lo stesso di Windows; Apple Silicon e Intel)
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cd Vettore
          cargo test --release --lib
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --bin orbit-vector --target $t
          done
          mkdir -p ../Resources/Motori
          lipo -create -output ../Resources/Motori/orbit-vector target/aarch64-apple-darwin/release/orbit-vector target/x86_64-apple-darwin/release/orbit-vector
          codesign -f -s - --options runtime ../Resources/Motori/orbit-vector
          lipo -info ../Resources/Motori/orbit-vector
          # Prova vera: un logo piccolo diventa un SVG (un rettangolo pieno resta pieno)
          python3 -c "
          import struct, zlib
          w, h = 120, 80
          rows = b''.join(b'\\x00' + b''.join((b'\\x1e\\x50\\x78' if 20 <= x < 100 and 15 <= y < 65 else b'\\xff\\xff\\xff') for x in range(w)) for y in range(h))
          def chunk(t, d): return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          open('/tmp/prova.png', 'wb').write(b'\\x89PNG\\r\\n\\x1a\\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(rows)) + chunk(b'IEND', b''))
          "
          ../Resources/Motori/orbit-vector /tmp/prova.png /tmp/prova.svg
          head -c 300 /tmp/prova.svg; echo
          echo "::notice::Motore del vettoriale pronto: $(du -h ../Resources/Motori/orbit-vector | cut -f1), $(lipo -archs ../Resources/Motori/orbit-vector)"

      - name: XcodeGen
        run: brew install xcodegen

      - name: Progetto
        run: xcodegen generate

      - name: Compilazione (Release, Apple Silicon e Intel)
        run: |
          status=0
          xcodebuild -project OrbitLR.xcodeproj -scheme OrbitLR -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            build > build.log 2>&1 || status=$?
          grep -E "(error|warning):|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -n 200 || true
          # Errori e avvisi come «annotazioni»: si leggono anche dalla pagina della compilazione e dall'API
          grep -E "^/.*:[0-9]+:[0-9]+: error:" build.log | sort -u | head -n 10 | while IFS= read -r l; do
            f=$(echo "$l" | cut -d: -f1); n=$(echo "$l" | cut -d: -f2); m=$(echo "$l" | cut -d: -f5-)
            echo "::error file=${f#$GITHUB_WORKSPACE/},line=$n::$m"
          done
          grep -E "error:" build.log | grep -vE "^/.*:[0-9]+:[0-9]+: error:" | sort -u | head -n 5 | while IFS= read -r l; do
            echo "::error::$l"
          done
          grep -E "^/.*:[0-9]+:[0-9]+: warning:" build.log | sort -u | head -n 20 | while IFS= read -r l; do
            f=$(echo "$l" | cut -d: -f1); n=$(echo "$l" | cut -d: -f2); m=$(echo "$l" | cut -d: -f5-)
            echo "::warning file=${f#$GITHUB_WORKSPACE/},line=$n::$m"
          done
          exit $status

      - name: Riepilogo avvisi
        if: always()
        run: |
          echo "## Compilazione" >> $GITHUB_STEP_SUMMARY
          echo "Errori: $(grep -c 'error:' build.log || true) · Avvisi: $(grep -c 'warning:' build.log || true)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "(error|warning):" build.log | sort -u | head -n 80 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Controllo dell'app
        run: |
          APP=build/Build/Products/Release/OrbitLR.app
          test -d "$APP"
          test -d "$APP/Contents/PlugIns/OrbitLRShare.appex"
          test -d "$APP/Contents/Resources/Models/RealESRNet.mlpackage"
          test -f "$APP/Contents/Resources/NOVITA.txt"
          # 4.2 · L'inglese: testi tradotti, permessi e novità
          test -f "$APP/Contents/Resources/NEWS.txt"
          ls "$APP/Contents/Resources/en.lproj"
          N=$(plutil -p "$APP/Contents/Resources/en.lproj/Localizable.strings" | grep -c "=>")
          plutil -p "$APP/Contents/Resources/en.lproj/Localizable.strings" | grep -q "Show in Finder"
          plutil -p "$APP/Contents/Resources/en.lproj/InfoPlist.strings" | grep -q "NSDesktopFolderUsageDescription"
          echo "::notice::Inglese dentro l'app: $N testi"
          test -x "$APP/Contents/Resources/Motori/ffmpeg"
          "$APP/Contents/Resources/Motori/ffmpeg" -hide_banner -loglevel error -f lavfi -i "sine=duration=0.5" -c:a libmp3lame /tmp/prova-motori.mp3
          echo "::notice::ffmpeg dentro l'app: funziona (MP3 di prova creato)"
          # 4.0 · «Voce più pulita»: i filtri devono esserci nel nostro ffmpeg (stessa catena del motore)
          "$APP/Contents/Resources/Motori/ffmpeg" -hide_banner -loglevel error -f lavfi -i "sine=f=220:duration=2" -f lavfi -i "anoisesrc=d=2:a=0.05" \
            -filter_complex "amix=inputs=2,highpass=f=80,afftdn=nr=12:nf=-35:tn=1,loudnorm=I=-16:TP=-1.5:LRA=11" -ar 48000 -c:a aac /tmp/prova-voce.m4a
          test -s /tmp/prova-voce.m4a && echo "::notice::Voce più pulita: filtri presenti"
          plutil -p "$APP/Contents/Info.plist" | grep -E "CFBundleShortVersionString|CFBundleVersion"
          # Deve girare sia sui Mac Apple Silicon sia sugli Intel
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/OrbitLR"); echo "Architetture: $ARCHS"
          echo "$ARCHS" | grep -q arm64 && echo "$ARCHS" | grep -q x86_64
          # 6.0.3 · Ogni programma dentro l'app (MacOS, Motori, PlugIns) deve avere sia Apple Silicon sia Intel
          bad=0; n=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q "Mach-O" || continue
            n=$((n+1)); a=$(lipo -archs "$f" 2>/dev/null)
            if echo "$a" | grep -q arm64 && echo "$a" | grep -q x86_64; then echo "ok  $a  ${f#$APP/}"
            else echo "::error::Non va su tutti i Mac: ${f#$APP/} ha solo «$a»"; bad=1; fi
          done < <(find "$APP/Contents/MacOS" "$APP/Contents/Resources/Motori" "$APP/Contents/PlugIns" "$APP/Contents/Frameworks" -type f -print0 2>/dev/null)
          echo "::notice::Programmi dentro l'app controllati (Apple Silicon e Intel): $n"
          [ $bad = 0 ] || exit 1
          codesign --verify --deep "$APP"
          du -sh "$APP"

      - name: Test automatici (video, musica, voci, audio)
        timeout-minutes: 25
        run: |
          status=0
          # Ogni test ha al massimo 3 minuti: uno bloccato fallisce con il suo nome, invece di fermare tutto
          # perl alarm: se tutto si blocca, dopo 20 minuti si ferma e si vede dove
          perl -e 'alarm shift; exec @ARGV' 1200 xcodebuild test -project OrbitLR.xcodeproj -scheme OrbitLRTests -destination 'platform=macOS' \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 \
            -derivedDataPath build-test CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            > test.log 2>&1 || status=$?
          grep -E "Test Case .*(passed|failed)|Executed|\*\* TEST" test.log | tail -n 80 || true
          if [ $status -ne 0 ] && ! grep -q "Executed [0-9]* tests" test.log; then
            last=$(grep -E "Test Case .* started" test.log | tail -n 1)
            echo "::error::Test interrotti (bloccati o app non avviata). Ultimo test partito: ${last:-nessuno}"
            tail -n 30 test.log | sed 's/^/  /'
          fi
          # Un test fallito diventa un errore leggibile dalla pagina della compilazione e dall'API
          grep -E "^/.*:[0-9]+: error: -\[" test.log | sort -u | head -n 20 | while IFS= read -r l; do
            f=$(echo "$l" | cut -d: -f1); n=$(echo "$l" | cut -d: -f2); m=$(echo "$l" | cut -d: -f4-)
            echo "::error file=${f#$GITHUB_WORKSPACE/},line=$n::$m"
          done
          # Errori di compilazione dei test (non i messaggi di sistema che contengono la parola «error»)
          grep -E "^/.*:[0-9]+:[0-9]+: error:" test.log | sort -u | head -n 5 | while IFS= read -r l; do
            echo "::error::$l"
          done
          # Test che si chiudono di colpo o saltati: anche loro con il nome, così si vede quale
          grep -E "Test Case .* skipped|unexpected exit|[Cc]rashed|Fatal error|signal (SIGABRT|SIGSEGV|SIGILL|SIGTRAP)" test.log | sort -u | head -n 12 | while IFS= read -r l; do
            echo "::error::$l"
          done
          # Il test che stava girando quando si è fermato (partito ma mai finito)
          awk '/Test Case .* started/ {cur=$0} /Test Case .* (passed|failed|skipped)/ {cur=""} /Restarting after unexpected exit/ {if (cur!="") print "::error::Interrotto (si è chiuso o ha superato il tempo): " cur; cur=""}' test.log | sort -u | head -n 5
          # 6.0.1 · Se un test si chiude di colpo o va oltre il tempo, le righe prima della ripartenza (per capire perché)
          if grep -q "Restarting after unexpected exit" test.log; then
            echo "::group::Righe prima della ripartenza"
            grep -n -B 40 "Restarting after unexpected exit" test.log | grep -vE "Test Case .* passed" | tail -n 60
            echo "::endgroup::"
          fi
          passed=$(grep -cE "Test Case .* passed" test.log || true)
          failed=$(grep -cE "Test Case .* failed" test.log || true)
          echo "::notice::Test superati: $passed · falliti: $failed"
          # 3.4.1 · I tempi misurati dai test di velocità, visibili nel riepilogo
          grep -oE "TEMPO: .*" test.log | grep -v MEDIANA | sort -u | head -n 30 | while read -r l; do echo "::notice::$l"; done
          echo "## Test automatici" >> $GITHUB_STEP_SUMMARY
          echo "Superati: $passed · Falliti: $failed" >> $GITHUB_STEP_SUMMARY
          # 6.0.1 · Mediane per il confronto prima/dopo, nel riepilogo e in un file a parte
          grep -oE "TEMPO: MEDIANA .*" test.log | sed 's/TEMPO: MEDIANA //' | sort -u > tempi.txt || true
          if [ -s tempi.txt ]; then
            echo "## Tempi (mediana)" >> $GITHUB_STEP_SUMMARY
            sed 's/^/- /' tempi.txt >> $GITHUB_STEP_SUMMARY
            while read -r l; do echo "::notice::MEDIANA $l"; done < tempi.txt
          fi
          exit $status

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: registro-test
          path: |
            test.log
            tempi.txt

      - name: Pacchetto .orbitlr
        run: |
          VERSION=$(cat version.txt)
          APP=build/Build/Products/Release/OrbitLR.app
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Contents/Info.plist")
          mkdir -p dist/OrbitLR
          # Per le OrbitLR fino alla 3.5.1 (che non conoscono la firma): sorgenti e app pronta, come prima
          git archive HEAD | tar -x -C dist/OrbitLR
          rm -rf dist/OrbitLR/.github
          mkdir -p dist/OrbitLR/Prebuilt
          ditto "$APP" dist/OrbitLR/Prebuilt/OrbitLR.app
          # 3.5.2 · La parte firmata: l'app in uno zip, il manifesto con la sua impronta (la firma arriva nel lavoro «release»)
          mkdir -p dist/OrbitLR/Firmato
          ditto -c -k --keepParent "$APP" dist/OrbitLR/Firmato/app.zip
          swift Tools/firma.swift manifesto "$VERSION" "$BUILD" dist/OrbitLR/Firmato/app.zip NOVITA.txt dist/OrbitLR/Firmato/manifest.json
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Controllo del pacchetto (3.5)
        run: |
          # L'app dentro il pacchetto deve dire la stessa versione del pacchetto (il bug della prima 3.3)
          for APP in dist/OrbitLR/Prebuilt/OrbitLR.app; do
            SHOWN=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
            if [ "$SHOWN" != "$VERSION" ]; then echo "::error::L'app nel pacchetto dice $SHOWN invece di $VERSION"; exit 1; fi
            codesign --verify --deep --strict "$APP" || { echo "::error::Firma dell'app nel pacchetto non valida"; exit 1; }
            codesign -dv "$APP" 2>&1 | grep -q "runtime" || { echo "::error::Manca il runtime rinforzato (3.5.2)"; exit 1; }
            lipo -archs "$APP/Contents/MacOS/OrbitLR" | grep -q arm64 || { echo "::error::Manca la parte per Apple Silicon"; exit 1; }
            lipo -archs "$APP/Contents/MacOS/OrbitLR" | grep -q x86_64 || { echo "::error::Manca la parte per Intel"; exit 1; }
          done
          rm -rf /tmp/controllo && mkdir -p /tmp/controllo && ditto -x -k dist/OrbitLR/Firmato/app.zip /tmp/controllo
          # 3.5.2 · L'app della parte firmata passa gli stessi controlli che farà il Mac prima di installarla
          FA=/tmp/controllo/OrbitLR.app
          test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" $FA/Contents/Info.plist)" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" $FA/Contents/Info.plist)" = "it.ledion.OrbitLR"
          codesign --verify --deep --strict "$FA" || { echo "::error::L'app firmata non supera codesign --strict"; exit 1; }
          lipo -archs "$FA/Contents/MacOS/OrbitLR" | grep -q arm64 && lipo -archs "$FA/Contents/MacOS/OrbitLR" | grep -q x86_64 \
            || { echo "::error::L'app firmata non ha entrambe le architetture"; exit 1; }
          echo "::notice::Pacchetto controllato: OrbitLR $SHOWN, firma del codice valida, Apple Silicon e Intel"
          # Il pacchetto passa al lavoro «release» così com'è (tar conserva i collegamenti dentro l'app)
          tar -C dist -cf pacchetto.tar OrbitLR

      - uses: actions/upload-artifact@v6
        with:
          name: pacchetto
          path: pacchetto.tar
          retention-days: 3

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: registro-compilazione
          path: build.log

  # 6.0.2 · La stessa app aperta davvero su più Mac di GitHub insieme (macOS 14, 15, 26, 27; Apple Silicon e Intel).
  # Fotografa la finestra vera (con barra del titolo e pallini) e controlla il motore del Downloader.
  # 6.0.3 · Anche il «primo avvio vero» (app scaricata, con la quarantena come da Safari: cosa mostra Gatekeeper),
  # la finestra più piccola possibile e il Dock sul lato. Le foto finiscono sul ramo «foto-dispositivi», una cartella per Mac.
  # Non blocca la pubblicazione (per ora).
  dispositivi:
    needs: build
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 14: GitHub l'ha ritirato il 2 novembre 2026; si prova finché c'è, un errore qui non conta
          - mac: macos-14
            nome: sonoma-apple
            prova: true
          - mac: macos-15
            nome: sequoia-apple
          - mac: macos-15-intel
            nome: sequoia-intel
            # Il Mac Intel di GitHub è virtuale e senza scheda grafica Metal: le app SwiftUI lì non si aprono.
            # Si prova lo stesso (il motore del Downloader sì), ma un errore qui non conta
            prova: true
          - mac: macos-26
            nome: tahoe-apple
          - mac: macos-26-intel
            nome: tahoe-intel
            prova: true
          # macOS 27 (anteprima): l'immagine si chiama «xcode-27», non «macos-27». Un errore qui non conta
          - mac: xcode-27
            nome: macos27-apple
            prova: true
    runs-on: ${{ matrix.mac }}
    continue-on-error: ${{ matrix.prova == true }}
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      NOME: ${{ matrix.nome }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: pacchetto
      - name: Il Mac
        run: |
          OUT="$RUNNER_TEMP/foto/$NOME"; rm -rf "$OUT"; mkdir -p "$OUT/primo-avvio"
          mkdir -p dist && tar -C dist -xf pacchetto.tar
          { sw_vers; uname -m; sysctl -n machdep.cpu.brand_string; sysctl -n hw.model; echo "commit: ${GITHUB_SHA::7}"; } | tee "$OUT/mac.txt"
          system_profiler SPDisplaysDataType | grep -E "Chipset|Resolution|Retina|UI Looks" | tee -a "$OUT/mac.txt" || true
          swiftc -O -o /tmp/finestra Tools/finestra.swift || echo "::warning::$NOME: finestra.swift non compila"

      # 6.0.3 · Come un utente vero: lo zip scaricato da Safari, l'app trascinata in Applicazioni, doppio clic.
      # Niente preferenze scritte prima, quarantena lasciata. Si annota cosa succede (Gatekeeper, processo, spctl).
      - name: Primo avvio vero (scaricata da Internet)
        timeout-minutes: 12
        run: |
          set +e
          t() { perl -e 'alarm shift; exec @ARGV' "$@"; }      # ogni comando ha un tempo massimo: niente attese infinite
          OUT="$RUNNER_TEMP/foto/$NOME"; P="$OUT/primo-avvio/risultato.txt"; : > "$P"
          say() { echo "$*" | tee -a "$P"; }
          say "Gatekeeper prima: $(t 20 spctl --status 2>&1)"
          t 30 sudo -n spctl --global-enable >/dev/null 2>&1 || t 30 sudo -n spctl --master-enable >/dev/null 2>&1
          say "Gatekeeper dopo averlo acceso: $(t 20 spctl --status 2>&1)"
          rm -rf ~/Downloads/prova && mkdir -p ~/Downloads/prova
          ditto -x -k dist/OrbitLR/Firmato/app.zip ~/Downloads/prova
          xattr -w com.apple.quarantine "0081;$(printf %x $(date +%s));Safari;" ~/Downloads/prova/OrbitLR.app
          pgrep -x OrbitLR >/dev/null && pkill -x OrbitLR
          sudo rm -rf /Applications/OrbitLR.app
          mv ~/Downloads/prova/OrbitLR.app /Applications/OrbitLR.app
          say "--- quarantena sull'app: $(xattr -p com.apple.quarantine /Applications/OrbitLR.app 2>&1)"
          say "--- spctl --assess -vv"; t 60 spctl --assess -vv --type execute /Applications/OrbitLR.app 2>&1 | tee -a "$P"
          say "--- codesign -dv"; codesign -dv /Applications/OrbitLR.app 2>&1 | grep -E "Signature|TeamIdentifier|flags" | tee -a "$P"
          if command -v syspolicy_check >/dev/null; then
            say "--- syspolicy_check distribution"; t 120 syspolicy_check distribution /Applications/OrbitLR.app 2>&1 | tail -n 30 | tee -a "$P"
          else say "--- syspolicy_check: non c'è su questo macOS"; fi
          t 20 open /Applications/OrbitLR.app; say "--- open: uscita $?"
          sleep 15
          if pgrep -x OrbitLR >/dev/null; then say "processo vivo dopo 15 s: sì"; ALIVE=si; else say "processo vivo dopo 15 s: no"; ALIVE=no; fi
          t 20 screencapture -x "$OUT/primo-avvio/schermo-gatekeeper.png"
          say "--- finestre sullo schermo"; t 20 /tmp/finestra --elenco | grep -vE "^(Window Server|Dock|Control Center|Centro di Controllo|SystemUIServer|Spotlight|TextInputMenuAgent)" | tee -a "$P"
          say "--- registro di sistema (Gatekeeper)"
          t 90 log show --last 2m --style compact --predicate 'process == "syspolicyd" OR process == "CoreServicesUIAgent"' 2>/dev/null | grep -iE "orbitlr|gatekeeper|notari|malware|assess" | tail -n 25 | tee -a "$P"
          echo "gatekeeper_vivo=$ALIVE" > "$OUT/primo-avvio/esito.txt"
          if [ "$ALIVE" = no ]; then
            # Come «Apri comunque» nelle Impostazioni: si toglie la quarantena e si riapre
            killall CoreServicesUIAgent 2>/dev/null; sleep 2
            xattr -dr com.apple.quarantine /Applications/OrbitLR.app
            t 20 open /Applications/OrbitLR.app; sleep 15
            say "--- dopo aver tolto la quarantena: processo vivo $(pgrep -x OrbitLR >/dev/null && echo sì || echo no)"
          fi
          t 20 screencapture -x "$OUT/primo-avvio/benvenuto-schermo.png"
          W=$(t 20 /tmp/finestra --tutte); say "--- finestra di benvenuto: ${W:-nessuna}"
          [ -n "$W" ] && t 20 screencapture -x -o -l"${W%% *}" "$OUT/primo-avvio/benvenuto.png"
          pgrep -x OrbitLR >/dev/null && t 15 osascript -e 'quit app "OrbitLR"'; sleep 3; pkill -x OrbitLR || true; sleep 1
          xattr -dr com.apple.quarantine /Applications/OrbitLR.app
          exit 0

      - name: Apro OrbitLR come un utente che la usa già
        timeout-minutes: 6
        run: |
          D=it.ledion.OrbitLR
          V=$(cat version.txt)
          defaults write $D welcomeDone -bool true
          defaults write $D launchScreen -bool false
          defaults write $D tips -bool false
          defaults write $D lastLaunchVersion -string "$V"
          open /Applications/OrbitLR.app
          sleep 20
          if ! pgrep -x OrbitLR >/dev/null; then
            echo "::error::$NOME: OrbitLR non è partita (o si è chiusa)"
            ls -la ~/Library/Logs/DiagnosticReports/ | grep -i orbit || echo "nessun rapporto di arresto"
            for f in ~/Library/Logs/DiagnosticReports/OrbitLR*; do [ -f "$f" ] && head -n 60 "$f"; done
            tail -n 40 ~/Library/Logs/LRConverter.log 2>/dev/null || true
            log show --last 2m --style compact --predicate 'process == "OrbitLR" OR eventMessage CONTAINS "OrbitLR"' 2>/dev/null | tail -n 60 || true
            echo "--- avvio diretto, 15 secondi ---"
            ( /Applications/OrbitLR.app/Contents/MacOS/OrbitLR > /tmp/diretto.txt 2>&1 & ); sleep 15; tail -n 40 /tmp/diretto.txt
            pgrep -x OrbitLR >/dev/null || exit 1
          fi
          echo "partita=si" > "$RUNNER_TEMP/foto/$NOME/partita.txt"
      - name: Foto della finestra (normale, bassa, minima, Dock a sinistra)
        timeout-minutes: 12
        run: |
          t() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          OUT="$RUNNER_TEMP/foto/$NOME"; mkdir -p "$OUT"
          D=it.ledion.OrbitLR
          shot() {   # $1 = nome della foto; fotografa la finestra di OrbitLR e annota la misura
            local W; W=$(/tmp/finestra || true); echo "$1: ${W:-nessuna finestra}" | tee -a "$OUT/mac.txt"
            [ -n "$W" ] && screencapture -x -o -l"${W%% *}" "$OUT/$1.png"
          }
          reopen() { t 20 osascript -e 'quit app "OrbitLR"' || pkill -x OrbitLR || true; sleep 3; pkill -x OrbitLR || true; open /Applications/OrbitLR.app; sleep 15; }
          frame() { for k in "NSWindow Frame main" "NSWindow Frame SwiftUI.main" "NSWindow Frame OrbitLR"; do defaults write $D "$k" "$1"; done; }
          shot finestra
          screencapture -x "$OUT/schermo.png" || true
          # Finestra bassa, come su un portatile da 13": si riapre con la misura salvata più piccola
          frame "60 60 1100 600 0 0 1440 900"; reopen; shot finestra-bassa
          # 6.0.3 · La finestra più piccola possibile (minimo nel codice: 880×620): si chiede più piccola, macOS la porta al minimo
          frame "60 60 600 400 0 0 1440 900"; reopen; shot finestra-minima
          # 6.0.3 · Dock sul lato sinistro, misura di partenza
          for k in "NSWindow Frame main" "NSWindow Frame SwiftUI.main" "NSWindow Frame OrbitLR"; do defaults delete $D "$k" 2>/dev/null || true; done
          defaults write com.apple.dock orientation left; killall Dock; sleep 4
          reopen; shot finestra-dock-sinistra
          screencapture -x "$OUT/schermo-dock-sinistra.png" || true
          defaults write com.apple.dock orientation bottom; killall Dock || true
          # 6.0.3 · L'avviso dopo un problema: si finge una chiusura di colpo (il file «in-corso» resta) e si riapre
          t 20 osascript -e 'quit app "OrbitLR"' || pkill -x OrbitLR || true; sleep 3; pkill -x OrbitLR || true
          S="$HOME/Library/Application Support/LRConverter"; mkdir -p "$S"
          printf 'avviata: prova · OrbitLR prova · avvio normale\nstava facendo: scheda: Conversione\n' > "$S/in-corso.txt"
          open /Applications/OrbitLR.app; sleep 15
          screencapture -x "$OUT/avviso-rapporto.png" || true
          /tmp/finestra --elenco | grep -i orbit | tee -a "$OUT/mac.txt"
          [ -f "$S/problema.txt" ] && { echo "--- problema registrato:"; cat "$S/problema.txt"; } | tee -a "$OUT/mac.txt"
          pkill -x OrbitLR || true
          ls -la "$OUT"
          [ -s "$OUT/finestra.png" ] || echo "::warning::$NOME: niente foto della finestra"
      - name: Motore del Downloader
        timeout-minutes: 5
        run: |
          OUT="$RUNNER_TEMP/foto/$NOME"
          curl -fsSL -o /tmp/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos && chmod +x /tmp/yt-dlp
          ( /tmp/yt-dlp --version 2>&1 | tee "$OUT/motore.txt" ) || echo "::error::$NOME: il motore del Downloader non parte"
          # YouTube su un Mac di GitHub: spesso chiede di confermare che non sei un robot (lo si annota, non è un errore dell'app)
          ( /tmp/yt-dlp --simulate --no-warnings --print title "https://www.youtube.com/watch?v=jNQXAC9IVRw" > "$OUT/youtube.txt" 2>&1 ) || true
          cat "$OUT/youtube.txt" | tail -n 5
      - name: Riga del riepilogo
        if: always()
        run: |
          OUT="$RUNNER_TEMP/foto/$NOME"; mkdir -p "$OUT"
          B="https://github.com/${GITHUB_REPOSITORY}/blob/foto-dispositivi/$NOME"
          OS=$(sw_vers -productVersion); CHIP=$(uname -m)
          PARTITA=$([ -f "$OUT/partita.txt" ] && echo sì || echo no)
          GK=$(grep -o "gatekeeper_vivo=.*" "$OUT/primo-avvio/esito.txt" 2>/dev/null | cut -d= -f2)
          GK=$([ "$GK" = si ] && echo "si apre" || ([ "$GK" = no ] && echo "bloccata" || echo "?"))
          L=""
          for f in finestra finestra-bassa finestra-minima finestra-dock-sinistra avviso-rapporto primo-avvio/schermo-gatekeeper primo-avvio/benvenuto; do
            [ -s "$OUT/$f.png" ] && L="$L [${f#primo-avvio/}]($B/$f.png)"
          done
          echo "| $NOME | $OS | $CHIP | $PARTITA | $GK | ${L:- nessuna foto} | ${GITHUB_SHA::7} |" > "$OUT/riga.md"
          { echo "| Mac | macOS | chip | partita | primo avvio da download | foto | commit |"; echo "|---|---|---|---|---|---|---|"; cat "$OUT/riga.md"; } >> $GITHUB_STEP_SUMMARY
      - name: Sul ramo «foto-dispositivi»
        if: always()
        run: |
          cd "$RUNNER_TEMP/foto" || exit 0
          git init -q -b foto-dispositivi
          git config user.name "OrbitLR"; git config user.email "actions@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          for i in 1 2 3 4 5; do
            git fetch -q origin foto-dispositivi 2>/dev/null && git reset -q origin/foto-dispositivi 2>/dev/null || true
            git add -A "$NOME" && git commit -q -m "$NOME · ${GITHUB_SHA::7}" || true
            git push -q origin HEAD:foto-dispositivi && break
            sleep $((RANDOM % 10 + 3))
          done

  # 6.0.3 · Una tabella sola con tutti i Mac (dalle righe scritte sul ramo «foto-dispositivi»)
  riepilogo-dispositivi:
    needs: dispositivi
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tabella
        run: |
          git clone -q --depth 1 -b foto-dispositivi "https://github.com/${GITHUB_REPOSITORY}.git" foto || exit 0
          {
            echo "## Prova sui dispositivi"
            echo "| Mac | macOS | chip | partita | primo avvio da download | foto | commit |"
            echo "|---|---|---|---|---|---|---|"
            for f in foto/*/riga.md; do
              if grep -q "${GITHUB_SHA::7}" "$f"; then cat "$f"; else echo "$(sed 's/ |$/ (vecchia) |/' "$f")"; fi
            done
          } >> $GITHUB_STEP_SUMMARY
          cat $GITHUB_STEP_SUMMARY

  # 3.5.2 · Solo questo lavoro vede la chiave di firma e può pubblicare. Gira solo sul ramo principale.
  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-15-intel
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v5
        with:
          name: pacchetto

      - name: Firma
        env:
          ORBITLR_SIGNING_KEY: ${{ secrets.ORBITLR_SIGNING_KEY }}
        run: |
          mkdir -p dist && tar -C dist -xf pacchetto.tar
          swift Tools/firma.swift firma dist/OrbitLR/Firmato/manifest.json dist/OrbitLR/Firmato/manifest.sig
          # Controllo con le chiavi scritte DENTRO l'app: se non tornano, niente pubblicazione
          KEYS=$(grep -oE '"[A-Za-z0-9+/]{43}="' Sources/UpdatePackage.swift | tr -d '"')
          swift Tools/firma.swift controlla dist/OrbitLR/Firmato $KEYS
          VERSION=$(cat version.txt)
          ditto -c -k --keepParent dist/OrbitLR "dist/OrbitLR $VERSION.orbitlr"
          du -h "dist/OrbitLR $VERSION.orbitlr"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v6
        with:
          name: OrbitLR-${{ env.VERSION }}
          path: dist/*.orbitlr

      - name: Release su GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG="v$VERSION"
          FILE="dist/OrbitLR $VERSION.orbitlr"
          # Una versione già pubblicata non si sovrascrive: le modifiche in corso non arrivano a chi aggiorna.
          # Per ripubblicarla apposta: commit con «[ripubblica]» nel messaggio.
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if echo "$COMMIT_MSG" | grep -q "\[ripubblica\]"; then
              gh release upload "$TAG" "$FILE" --clobber -R "$GITHUB_REPOSITORY"
            else
              echo "La release $TAG esiste già: non la tocco."
            fi
          else
            gh release create "$TAG" "$FILE" --title "OrbitLR $VERSION" --notes-file NOVITA.txt -R "$GITHUB_REPOSITORY"
          fi
