[package]
name = "orbit_engine"
version = "0.1.0"
edition = "2021"
description = "Il motore di OrbitLR per Windows: video, audio, foto e PDF sul computer, senza internet"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "ico", "webp"] }
fs4 = "1"
lopdf = "0.46"
ureq = "3"
sha2 = "0.11"
tract-onnx = "0.21"
zip = { version = "2", default-features = false, features = ["deflate"] }
ed25519-dalek = "2"
base64 = "0.22"
getrandom = "0.3"
imageproc = { version = "0.25", default-features = false }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
windows = { version = "0.62", features = ["Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams", "Storage_Search", "Data_Pdf"] }
