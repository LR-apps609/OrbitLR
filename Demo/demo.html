<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>OrbitLR demo</title>
<style>
  :root {
    --sage:#A9C5A0; --sageLight:#C9DCC2; --sageDeep:#557E5F; --cream:#F3EDDF; --ivory:#FBF8F0;
    --brass:#B8925A; --ink:#3A3126; --green:#5E9A55; --stroke:rgba(58,49,38,.11);
    --img:#4E9A92; --video:#8A6BA6; --pdf:#C8654F; --audio:#C99134;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1280px; height:800px; overflow:hidden; background:#2b2f2b; font-family:Inter, sans-serif; color:var(--ink); }
  #camera { position:absolute; inset:0; transform-origin:0 0; }
  .win { position:absolute; left:40px; top:30px; width:1200px; height:740px; border-radius:14px; overflow:hidden;
         background:var(--cream); box-shadow:0 30px 80px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.25); }
  .titlebar { position:absolute; left:0; right:0; top:0; height:40px; display:flex; align-items:center; padding-left:16px; gap:8px; z-index:3; }
  .dot { width:12px; height:12px; border-radius:50%; }
  .sidebar { position:absolute; left:0; top:0; bottom:0; width:210px; background:#E7E3D4; border-right:1px solid var(--stroke); padding:52px 10px 10px; }
  .sb-h { font-size:10.5px; font-weight:700; color:rgba(58,49,38,.5); margin:14px 10px 6px; letter-spacing:.04em; }
  .sb-i { display:flex; align-items:center; gap:10px; height:30px; padding:0 10px; border-radius:7px; font-size:13px; font-weight:500; }
  .sb-i.sel { background:rgba(85,126,95,.22); font-weight:600; }
  .sb-ic { width:18px; height:18px; border-radius:5px; }
  .main { position:absolute; left:210px; top:0; right:0; bottom:0; }
  .glow { position:absolute; inset:0; background:radial-gradient(circle at 50% 48%, rgba(85,126,95,.18), rgba(169,197,160,.09) 40%, transparent 70%); }
  .card { background:var(--ivory); border:1px solid var(--stroke); border-radius:14px; box-shadow:0 2px 6px rgba(58,49,38,.08); }
  .caption { position:absolute; left:50%; bottom:34px; transform:translateX(-50%); padding:11px 20px; border-radius:22px;
             background:rgba(30,32,30,.95); color:#fff; font-size:18px; font-weight:600; white-space:nowrap; z-index:50;
             box-shadow:0 8px 30px rgba(0,0,0,.3); }
  .caption b { color:#E6C28A; margin-right:8px; }
  #cursor { position:absolute; width:26px; height:34px; z-index:60; pointer-events:none; }
  .ripple { position:absolute; border-radius:50%; border:3px solid rgba(184,146,90,.95); z-index:59; pointer-events:none; }
  .key { position:absolute; padding:14px 26px; border-radius:16px; background:rgba(30,32,30,.9); color:#fff; font-size:40px; font-weight:700; z-index:55;
         box-shadow:0 10px 40px rgba(0,0,0,.35); }
  .muted { color:rgba(58,49,38,.6); }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:4px 10px 4px 5px; border-radius:20px; font-size:12.5px; font-weight:600;
          background:var(--ivory); border:1px solid var(--stroke); }
  .chip .n { width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; }
  .btn { display:inline-flex; align-items:center; padding:5px 12px; border-radius:7px; background:#fff; border:1px solid rgba(0,0,0,.14); font-size:12.5px; font-weight:500; }
</style>
</head>
<body>
<div id="camera"><div id="stage"></div></div>
<div id="overlay"></div>
<svg id="cursor" viewBox="0 0 26 34"><path d="M3 2 L3 26 L9 20.5 L13 30 L17.5 28 L13.5 18.8 L21.5 18.8 Z" fill="#111" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
<script>
// ── Utilità di tempo ───────────────────────────────────────────────
const clamp = (v, a=0, b=1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;
const easeOut = p => 1 - Math.pow(1 - p, 3);
const lerp = (a, b, p) => a + (b - a) * p;
// Percorso a tappe: [[t, x, y], ...] con movimento morbido tra una tappa e l'altra
function track(t, keys) {
  if (t <= keys[0][0]) return [keys[0][1], keys[0][2]];
  for (let i = 1; i < keys.length; i++) {
    const [t1, x1, y1] = keys[i], [t0, x0, y0] = keys[i-1];
    if (t <= t1) { const p = ease(seg(t, t0, t1)); return [lerp(x0, x1, p), lerp(y0, y1, p)]; }
  }
  const k = keys[keys.length-1]; return [k[1], k[2]];
}
// Zoom della «telecamera»: [[t, scala, centroX, centroY], ...]
function camera(t, keys) {
  let s = keys[0][1], cx = keys[0][2], cy = keys[0][3];
  for (let i = 1; i < keys.length; i++) {
    const [t1, s1, x1, y1] = keys[i], [t0, s0, x0, y0] = keys[i-1];
    if (t >= t0) { const p = ease(seg(t, t0, t1)); s = lerp(s0, s1, p); cx = lerp(x0, x1, p); cy = lerp(y0, y1, p); }
  }
  const tx = 640 - cx * s, ty = 400 - cy * s;
  document.getElementById('camera').style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
  return { s, tx, ty };
}
function placeCursor(x, y, cam, press) {
  const c = document.getElementById('cursor');
  // il cursore resta della sua misura anche durante lo zoom
  c.style.left = (x * cam.s + cam.tx - 3) + 'px';
  c.style.top = (y * cam.s + cam.ty - 2) + 'px';
  c.style.transform = `scale(${press ? 0.88 : 1})`;
}
function ripples(t, clicks, cam) {
  let html = '';
  for (const [tc, x, y] of clicks) {
    const p = seg(t, tc, tc + 0.45);
    if (p > 0 && p < 1) {
      const r = 10 + 34 * easeOut(p), X = x * cam.s + cam.tx, Y = y * cam.s + cam.ty;
      html += `<div class="ripple" style="left:${X-r}px;top:${Y-r}px;width:${2*r}px;height:${2*r}px;opacity:${1-p}"></div>`;
    }
  }
  return html;
}
function caption(t, list) {
  for (const [a, b, n, text] of list) {
    if (t >= a && t < b) {
      const o = Math.min(seg(t, a, a + .25), 1 - seg(t, b - .25, b));
      return `<div class="caption" style="opacity:${o}"><b>${n}</b>${text}</div>`;
    }
  }
  return '';
}
const icon = (c) => `<div class="sb-ic" style="background:${c}"></div>`;

function windowChrome(selected, body) {
  const items = [['Conversione','var(--sageDeep)'],['File','var(--pdf)'],['Immagini','var(--img)'],['Video','var(--video)'],['Audio','var(--audio)']];
  const acts = [['Coda','var(--brass)'],['Cronologia','var(--video)'],['Aiuto','var(--sageDeep)']];
  const row = ([n, c]) => `<div class="sb-i ${n === selected ? 'sel' : ''}">${icon(c)}${n}</div>`;
  return `<div class="win">
    <div class="titlebar"><div class="dot" style="background:#FF5F57"></div><div class="dot" style="background:#FEBC2E"></div><div class="dot" style="background:#28C840"></div></div>
    <div class="sidebar"><div class="sb-h">SCHEDE</div>${items.map(row).join('')}<div class="sb-h">ATTIVITÀ</div>${acts.map(row).join('')}
      <div class="sb-i" style="margin-top:14px;background:rgba(243,237,223,.6);font-size:12px;font-weight:600;color:rgba(58,49,38,.75)">⚙︎ Avanzate <span style="margin-left:auto">›</span></div></div>
    <div class="main">${body}</div></div>`;
}

// ═══ Scena 1 · Converti un file ════════════════════════════════════
const PETALS = [
  ['JPG', '≈ 1,1 MB', 'g'], ['PNG', '≈ 9,8 MB', 'b'], ['HEIC', '≈ 2,9 MB', 'g'], ['Misura', '', ''],
  ['Testo', '', ''], ['PDF', '≈ 1,3 MB', 'g'], ['Dati', '', ''], ['Altro', '', '']
];
function sceneConvert(t) {
  const CX = 815, CY = 400;               // centro della zona (coordinate della scena)
  const dropT = 2.6, pickT = 5.9;
  const drag = t >= 1.4 && t < dropT;
  const over = t >= 1.9 && t < dropT;
  // Zona vuota
  let main = `<div class="glow"></div>`;
  const zoneO = 1 - seg(t, dropT, dropT + .25);
  main += `<div style="position:absolute;left:60px;top:90px;width:870px;height:560px;border-radius:28px;opacity:${zoneO};
      border:2px dashed rgba(85,126,95,${over ? .9 : .45});background:rgba(85,126,95,${over ? .13 : .05})">
      <div style="position:absolute;left:50%;top:150px;transform:translateX(-50%);width:168px;height:168px;border-radius:50%;
        background:conic-gradient(var(--pdf) 0 12%, var(--img) 12% 25%, var(--video) 25% 37%, var(--audio) 37% 50%, #5B7FAA 50% 62%, #6E9A52 62% 75%, #D29F45 75% 87%, #7B83A8 87% 100%);
        -webkit-mask:radial-gradient(circle, transparent 47px, #000 48px, #000 64px, transparent 65px); transform:translateX(-50%) rotate(${t*9}deg)"></div>
      <div style="position:absolute;left:50%;top:197px;transform:translateX(-50%);width:74px;height:74px;border-radius:50%;background:var(--ivory);border:2px solid var(--brass);
        display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:var(--sageDeep)">${over ? '↓' : '+'}</div>
      <div style="position:absolute;left:0;right:0;top:350px;text-align:center;font-size:24px;font-weight:700">${over ? 'Rilascia: ti propongo cosa farne' : 'Trascina qui i tuoi file'}</div>
      <div class="muted" style="position:absolute;left:0;right:0;top:388px;text-align:center;font-size:13px">oppure clicca per sceglierli · anche dal Finder: clic destro → OrbitLR</div>
    </div>`;
  // Torta
  if (t >= dropT && t < pickT + .35) {
    const open = easeOut(seg(t, dropT, dropT + .5));
    const close = seg(t, pickT + .05, pickT + .35);
    const k = open * (1 - close);
    const fx = lerp(580, 495, open), fy = lerp(390, 370, open);   // nasce dal punto in cui lasci il file
    const hover = t >= 4.25 && t < pickT + .05 ? 0 : -1;
    let petals = '';
    PETALS.forEach(([name, est, col], i) => {
      const a = -Math.PI / 2 + i * Math.PI * 2 / 8;
      const R = 150 * k, x = Math.cos(a) * R, y = Math.sin(a) * R;
      const on = i === hover, sc = (on ? 1.15 : 1) * (0.4 + 0.6 * k);
      const color = col === 'g' ? 'var(--green)' : 'var(--brass)';
      petals += `<div style="position:absolute;left:${x - 46}px;top:${y - 46}px;width:92px;height:92px;border-radius:50%;transform:scale(${sc});
          background:${on ? 'linear-gradient(160deg,#5fb0a7,var(--img))' : 'var(--ivory)'};color:${on ? '#fff' : 'var(--ink)'};
          border:${i === 0 && !on ? '2px solid var(--img)' : '1px solid rgba(58,49,38,.14)'};box-shadow:${on ? '0 6px 16px rgba(78,154,146,.6)' : '0 2px 3px rgba(58,49,38,.12)'};
          display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;opacity:${k}">
          <div style="width:22px;height:18px;border-radius:4px;border:2.5px solid currentColor;opacity:.85"></div>
          <div style="font-size:13.5px;font-weight:600">${name}</div>
          ${est ? `<div style="font-size:10px;font-weight:600;color:${on ? 'rgba(255,255,255,.92)' : color}">${est}</div>` : ''}
          ${i === 0 && !on ? '<div style="position:absolute;right:6px;top:4px;width:17px;height:17px;border-radius:50%;background:var(--brass);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center">★</div>' : ''}
        </div>`;
    });
    // spicchi ad anello d'ottone dietro
    main += `<div style="position:absolute;left:${fx}px;top:${fy}px;width:0;height:0;z-index:5">
        <div style="position:absolute;left:${-215*k}px;top:${-215*k}px;width:${430*k}px;height:${430*k}px;border-radius:50%;background:rgba(251,248,240,.55);
          border:3px solid rgba(184,146,90,.85);box-shadow:0 20px 60px rgba(58,49,38,.18)"></div>
        ${petals}
        <div style="position:absolute;left:-44px;top:-44px;width:88px;height:88px;border-radius:50%;transform:scale(${0.4+0.6*k});background:var(--ivory);
          border:2px solid var(--brass);overflow:hidden;opacity:${k};display:flex;align-items:center;justify-content:center">
          <div style="width:64px;height:48px;border-radius:6px;background:linear-gradient(180deg,#8EC5E8 0 55%,#E9D7A8 55% 70%,#4E9A92 70%)"></div>
        </div>
      </div>`;
  }
  // Risultato
  if (t >= pickT + .3) {
    const up = easeOut(seg(t, pickT + .3, pickT + .7));
    const prog = clamp(seg(t, pickT + .6, pickT + 2.0));
    const done = prog >= 1;
    let ticks = ''; for (let i = 1; i < 10; i++) ticks += `<div style="position:absolute;left:${i*10}%;top:0;bottom:0;width:1px;background:rgba(58,49,38,.18)"></div>`;
    main += `<div class="card" style="position:absolute;left:60px;right:60px;bottom:${40 + (1-up)*-90}px;opacity:${up};padding:14px 18px;display:flex;align-items:center;gap:14px">
        <div style="flex:1">
          <div style="display:flex;font-size:13px;font-weight:600"><span>Converti in JPG</span>
            <span class="muted" style="margin-left:auto;font-weight:500;font-size:12px">${done ? '«foto-mare.jpg» in Download' : 'Converto… ' + Math.round(prog*100) + '%'}</span></div>
          <div style="position:relative;margin-top:7px;height:18px;border-radius:9px;background:rgba(94,154,85,.22);overflow:hidden">
            <div style="position:absolute;left:0;top:0;bottom:0;width:${prog*100}%;background:var(--green)"></div>${ticks}
            <div style="position:absolute;left:calc(${prog*100}% - 1px);top:-2px;bottom:-2px;width:3px;background:var(--brass)"></div>
            <div style="position:absolute;right:8px;top:1px;font-size:11px;font-weight:700;color:${prog > .9 ? '#fff' : 'var(--ink)'}">${Math.round(prog*100)}%</div>
          </div>
        </div>
        ${done ? '<div class="btn">Mostra nel Finder</div>' : ''}
      </div>`;
  }
  let html = windowChrome('Conversione', main);
  // File sulla scrivania (fuori dalla finestra, in basso a destra)
  const [fxp, fyp] = drag || t < 1.4 ? track(t, [[0, 1150, 690], [1.4, 1150, 690], [2.5, 830, 420]]) : [1150, 690];
  if (t < dropT) {
    const lifted = drag ? 1 : 0;
    html += `<div style="position:absolute;left:${fxp - 36}px;top:${fyp - 40}px;width:72px;text-align:center;z-index:40;opacity:${drag ? .9 : 1};
        transform:scale(${1 + lifted*0.06})">
        <div style="width:64px;height:50px;margin:0 auto;border-radius:6px;border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.35);
          background:linear-gradient(180deg,#8EC5E8 0 55%,#E9D7A8 55% 70%,#4E9A92 70%)"></div>
        <div style="margin-top:5px;white-space:nowrap;margin-left:-20px;margin-right:-20px;font-size:11px;font-weight:600;color:#fff;background:${drag ? 'transparent' : 'rgba(40,90,180,.85)'};border-radius:4px;padding:1px 3px;display:inline-block">foto-mare.heic</div>
      </div>`;
  }
  const cam = camera(t, [[0, 1, 640, 400], [4.3, 1, 640, 400], [4.9, 2.1, 745, 290], [5.6, 2.1, 745, 290], [6.1, 1, 640, 400],
                         [7.3, 1, 640, 400], [7.9, 1.3, 745, 610], [9.5, 1.3, 745, 610]]);
  const [x, y] = track(t, [[0, 900, 560], [0.6, 900, 560], [1.35, 1150, 690], [1.45, 1150, 690], [2.5, 830, 420], [3.2, 830, 420],
                           [4.2, 745, 252], [5.9, 745, 252], [7.2, 990, 690], [9.5, 1105, 694]]);
  const cap = caption(t, [[0.15, 2.7, '1', 'Trascina il file nella finestra'],
                      [2.8, 5.95, '2', 'Scegli lo spicchio: sotto c’è il peso previsto'],
                      [6.0, 9.5, '3', 'Fatto: il file nuovo, l’originale resta com’è']]);
  document.getElementById('stage').innerHTML = html;
  placeCursor(x, y, cam, (t > 1.4 && t < dropT) || Math.abs(t - pickT) < .08);
  return cap + ripples(t, [[1.42, 1150, 690], [pickT, 745, 252], [9.05, 1105, 694]], cam);
}

// ═══ Scena 2 · Togli una clip ══════════════════════════════════════
function sceneClip(t) {
  const selT = 1.7, xT = 4.0, undoT = 6.4;
  const removed = t >= xT && t < undoT;
  const goneP = removed ? easeOut(seg(t, xT, xT + .45)) : (t >= undoT ? 1 - easeOut(seg(t, undoT, undoT + .45)) : 0);
  const selected = t >= selT && t < xT + .05;
  const clips = [[0, 232, '#7EA6C9', '#4F7FA8', '0:08'], [1, 232, '#E0B07A', '#B9824A', '0:08'], [2, 232, '#8FBE98', '#557E5F', '0:08']];
  const count = removed && goneP > .5 ? 2 : 3, dur = count === 2 ? '0:16' : '0:24';
  let x0 = 30, row = '';
  clips.forEach(([i, w, c1, c2, len]) => {
    const ww = i === 1 ? w * (1 - goneP) : w;
    const op = i === 1 ? 1 - goneP : 1;
    let stripes = ''; for (let k = 0; k < 5; k++) stripes += `<div style="flex:1;background:linear-gradient(180deg,${c1},${c2});border-right:1px solid rgba(255,255,255,.25)"></div>`;
    const sel = i === 1 && selected;
    if (ww > 1) row += `<div style="position:absolute;left:${x0}px;top:36px;width:${ww - 2}px;height:62px;border-radius:6px;overflow:hidden;opacity:${op};
        display:flex;border:${sel ? '3px solid var(--brass)' : '1px solid rgba(0,0,0,.15)'}">${stripes}
        <div style="position:absolute;left:4px;bottom:4px;font-size:9.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);border-radius:3px;padding:1px 4px">${len}</div>
        ${sel ? `<div style="position:absolute;right:10px;top:4px;width:17px;height:17px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:800;
            display:flex;align-items:center;justify-content:center">✕</div>` : ''}
      </div>`;
    x0 += ww;
  });
  let ruler = ''; for (let s = 0; s <= 24; s += 2) ruler += `<div style="position:absolute;left:${30 + s * 29}px;top:6px;font-size:9.5px" class="muted">0:${String(s).padStart(2,'0')}</div>`;
  const chips = [['1', 'Taglia', true], ['2', 'Audio e musica'], ['3', 'Formato'], ['4', 'Esporta']].map(([n, l, on], i) =>
    `${i ? '<span class="muted" style="font-size:10px">›</span>' : ''}<span class="chip" style="${on ? 'background:var(--video);color:#fff;border-color:transparent' : ''}">
      <span class="n" style="background:${on ? 'rgba(255,255,255,.9);color:var(--video)' : 'rgba(138,107,166,.18)'}">${n}</span>${l}</span>`).join(' ');
  const main = `
    <div style="position:absolute;left:20px;right:20px;top:50px;display:flex;align-items:center;gap:10px">
      <div><div style="font-size:15px;font-weight:700">Progetto 1</div><div class="muted" style="font-size:12px">${count} clip · ${dur}</div></div>
      <div style="margin-left:auto" class="btn">↶</div><div class="btn">↷</div><div class="btn">Aggiungi video…</div>
      <div style="width:26px;height:26px;border-radius:50%;background:rgba(58,49,38,.08);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px">✕</div>
    </div>
    <div style="position:absolute;left:20px;right:20px;top:104px;height:330px;border-radius:14px;background:#151515;overflow:hidden">
      <div style="position:absolute;left:50%;top:0;bottom:0;width:186px;transform:translateX(-50%);background:linear-gradient(180deg,#7EA6C9 0%,#9FC3DA 45%,#E3D2A6 46%,#C9B07C 70%,#4E7A55 71%)"></div>
      <div style="position:absolute;left:18px;bottom:14px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:12px">▶</div>
    </div>
    <div class="card" style="position:absolute;left:20px;right:20px;top:446px;height:112px">${ruler}${row}
      <div style="position:absolute;left:${30 + 2.2*29}px;top:22px;width:2px;height:84px;background:var(--ink)"></div></div>
    <div style="position:absolute;left:20px;right:20px;top:572px;display:flex;align-items:center;gap:6px">${chips}</div>
    <div class="muted" style="position:absolute;left:20px;top:606px;font-size:11.5px">💡 Trascina i bordi d’ottone di una clip per accorciarla, premi S per dividerla, trascina una clip per spostarla.</div>
    <div class="card" style="position:absolute;left:20px;right:20px;top:636px;height:62px;display:flex;align-items:center;padding:0 16px;gap:10px">
      <div><div class="muted" style="font-size:10px;font-weight:700">STRUMENTO</div><div style="font-size:14px;font-weight:700">Taglia</div></div>
      <div class="btn" style="margin-left:20px">Inizio qui</div><div class="btn">Fine qui</div><div class="btn">Dividi</div><div class="btn">🔇 Togli l’audio</div>
      <div style="margin-left:auto;padding:8px 18px;border-radius:8px;background:var(--sageDeep);color:#fff;font-weight:700;font-size:13px">Esporta</div>
    </div>`;
  let html = windowChrome('Video', main);
  // la clip 2 sta in x 210+20+30+260 .. +220 nella scena (finestra a 40,30)
  const clipX = 40 + 210 + 20 + 30 + 232, clipY = 30 + 446 + 36;
  const xBtnX = clipX + 232 - 2 - 10 - 8, xBtnY = clipY + 4 + 8;
  if (t >= 5.6 && t < undoT + .5) {
    const o = Math.min(seg(t, 5.6, 5.85), 1 - seg(t, undoT + .2, undoT + .5));
    html += `<div class="key" style="left:560px;top:300px;opacity:${o};transform:scale(${0.9 + 0.1*o})">⌘ Z</div>`;
  }
  const cam = camera(t, [[0, 1, 640, 400], [2.0, 1, 640, 400], [2.6, 1.9, clipX + 110, clipY + 10], [3.9, 1.9, clipX + 110, clipY + 10],
                         [4.9, 1.9, clipX + 110, clipY + 10], [5.5, 1, 640, 400], [8.5, 1, 640, 400]]);
  const [x, y] = track(t, [[0, 700, 300], [0.4, 700, 300], [1.6, clipX + 110, clipY + 34], [3.2, clipX + 110, clipY + 34],
                           [3.9, xBtnX, xBtnY], [4.6, xBtnX, xBtnY], [5.5, 820, 380], [8.5, 820, 380]]);
  const cap = caption(t, [[0.15, 3.1, '1', 'Clicca la clip da togliere'],
                      [3.1, 5.4, '2', 'Premi la ✕ sulla clip (oppure il tasto ⌫)'],
                      [5.4, 8.5, '3', 'Ti sei sbagliato? ⌘Z la rimette']]);
  document.getElementById('stage').innerHTML = html;
  placeCursor(x, y, cam, Math.abs(t - selT) < .08 || Math.abs(t - xT) < .08);
  return cap + ripples(t, [[selT, clipX + 110, clipY + 34], [xT, xBtnX, xBtnY]], cam);
}

const SCENES = { convert: [sceneConvert, 9.5], clip: [sceneClip, 8.5] };
window.render = (name, t) => {
  document.getElementById('overlay').innerHTML = SCENES[name][0](t);
};
window.duration = (name) => SCENES[name][1];
</script>
