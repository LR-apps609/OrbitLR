[package]
name = "vettore"
version = "0.1.0"
edition = "2021"
description = "OrbitLR: da immagine a vettoriale (SVG): colori puliti, angoli netti, cerchi e linee veri"
license = "MIT"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }
imageproc = { version = "0.25", default-features = false }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

[[bin]]
name = "orbit-vector"
path = "src/bin/orbit-vector.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
